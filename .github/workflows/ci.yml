name: MVP checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oral_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JWT_SECRET: ci-test-only-secret-at-least-thirty-two-characters
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-password@localhost:5432/oral_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r services/api/requirements.lock && pip install --no-deps -e services/api
      - name: PostgreSQL migration from MVP
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic -c services/api/alembic.ini upgrade 0001
          alembic -c services/api/alembic.ini downgrade base
          alembic -c services/api/alembic.ini upgrade head
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ruff check services/api apps/desktop/transcribe.py scripts tests/test_desktop_launcher.py
      - run: python -m unittest discover -s tests -p test_desktop_launcher.py -v
      - run: pytest services/api/tests -q
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run build
      - run: npm run check -w apps/desktop
      - run: npm run test:audio && npm run test:desktop
      - run: npm audit --audit-level=high
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python3 scripts/setup_env.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 240
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
      - if: always()
        run: docker compose down -v
