name: Desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check -w apps/desktop
      - name: Verify Windows desktop exit
        if: runner.os == 'Windows'
        run: npm run test:desktop-exit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_desktop_stt.py -v
      - name: CPU-only conversion dependencies on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r scripts/requirements-desktop-stt.txt
      - run: python scripts/build_desktop_stt.py
      - run: npm run dist -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: OralAI-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
