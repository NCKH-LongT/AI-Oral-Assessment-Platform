name: Desktop installers
on:
  workflow_dispatch:
    inputs:
      bundle_stt:
        description: Bundle Python/Whisper locally (large installers, model downloads on first use)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check -w apps/desktop
      - uses: actions/setup-python@v5
        if: inputs.bundle_stt
        with:
          python-version: '3.12'
      - if: inputs.bundle_stt
        run: python -m pip install -r services/api/requirements.lock "pyinstaller>=6,<7"
      - if: inputs.bundle_stt
        run: python scripts/build_desktop_stt.py
      - run: npm run dist -w apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: OralAI-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14
