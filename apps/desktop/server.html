<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>Cấu hình máy chủ OralAI</title><link rel="stylesheet" href="server.css"></head><body><main><h1>Cấu hình máy chủ</h1><p>Nhập domain gốc của OralAI. Ứng dụng sẽ kết nối web và API qua địa chỉ này.</p><form id="server-form"><label for="server-url">Domain gốc</label><input id="server-url" type="url" required placeholder="https://oral.example.edu" autocomplete="url"><p>Ví dụ: https://oral.example.edu hoặc http://localhost:3000 khi chạy trên máy này. Không thêm /api.</p><div><button type="button" id="test">Kiểm tra kết nối</button><button type="submit">Lưu & kết nối</button></div></form><p id="status" role="status"></p><small>Cấu hình được lưu trên máy này. Đổi máy chủ sẽ tải lại ứng dụng; hãy nộp bài đang làm trước.</small></main><script src="server.js"></script></body></html>
