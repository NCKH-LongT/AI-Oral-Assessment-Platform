services:
  api:
    environment:
      GOPT_ENABLED: "true"
      LOCAL_LLM_CPU_THREADS: "0"
      GOPT_URL: http://gopt:8000
  worker:
    command: [env, -u, OMP_NUM_THREADS, -u, OPENBLAS_NUM_THREADS, -u, MKL_NUM_THREADS, -u, NUMEXPR_NUM_THREADS, python, -m, app.worker]
    environment:
      GOPT_ENABLED: "true"
      LOCAL_LLM_CPU_THREADS: "0"
      GOPT_URL: http://gopt:8000
      GOPT_TIMEOUT: ${GOPT_TIMEOUT:-960}
      GOPT_MAX_AUDIO_MB: ${GOPT_MAX_AUDIO_MB:-24}
      WORKER_SERIAL: "true"
      STT_CPU_THREADS: "0"
    depends_on:
      gopt:
        condition: service_healthy
  gopt:
    command: [env, -u, OMP_NUM_THREADS, -u, OPENBLAS_NUM_THREADS, -u, MKL_NUM_THREADS, -u, NUMEXPR_NUM_THREADS, python, -m, uvicorn, "server:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --no-access-log]
    init: true
    build:
      context: ./services/gopt
      args:
        BUILD_JOBS: "1"
    environment:
      GOPT_MAX_AUDIO_MB: ${GOPT_MAX_AUDIO_MB:-24}
      GOPT_MAX_AUDIO_SECONDS: ${GOPT_MAX_AUDIO_SECONDS:-120}
      GOPT_JOB_TIMEOUT: ${GOPT_JOB_TIMEOUT:-900}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
