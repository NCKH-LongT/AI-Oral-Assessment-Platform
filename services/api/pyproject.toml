[project]
name = "oral-assessment-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "boto3>=1.37,<2",
  "pypdf>=5,<7", "python-pptx>=1,<2", "python-docx>=1.1,<2", "redis>=5,<7"
]
[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["sample.txt"]
